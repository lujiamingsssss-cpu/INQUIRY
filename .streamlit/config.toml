[client]
toolbarMode = "minimal"

[server]
fileWatcherType = "none"
# 首次运行不再弹出邮箱提示，双击启动脚本时不会被它挡住
showEmailPrompt = false
headless = false

[theme]
base = "light"
primaryColor = "#316A5D"
backgroundColor = "#F2EFE7"
secondaryBackgroundColor = "#FBFAF6"
textColor = "#102B27"
borderColor = "#D7D0C3"
showWidgetBorder = true
